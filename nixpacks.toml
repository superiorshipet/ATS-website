[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Extensions.mbstring", "php83Extensions.fileinfo", "composer", "nodejs", "pnpm"]

[phases.install]
cmds = ["pnpm config set store-dir /app/.pnpm-store", "cd /app && pnpm install --frozen-lockfile", "cd /app/backend && composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["cd /app && pnpm build", "cd /app/backend && php artisan config:clear && php artisan route:clear"]

[start]
cmd = "sh start.sh"
